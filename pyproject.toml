[project]
name = "araxia-bridge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["bleak>=0.22.0", "pynacl>=1.5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools]
packages = ["bridge"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
